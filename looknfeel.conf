# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 4

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(ccccffff)
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 4

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# Smart gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]

# Chrome opacity (patch for ~/.local/share/omarchy/default/hypr/apps/chromium.conf)
windowrule = tag +chromium-based-browser, class:(google-)?[cC]hrom(e|ium)(-stable|-unstable)?|[bB]rave-browser|Microsoft-edge|Vivaldi-stable
windowrulev2 = opacity 1 1, tag:chromium-based-browser

# Video websites
windowrule = opacity 1 1, initialTitle:.*twitch\.tv.*
windowrule = opacity 1 1, initialTitle:.*corridordigital\.com.*
windowrule = opacity 1 1, initialTitle:.*floatplane\.com.*
windowrule = opacity 1 1, initialTitle:.*vivaplus\.tv.*
windowrule = opacity 1 1, title:.*Home Assistant.*

windowrule = workspace 3, class:^(BambuStudio|OrcaSlicer)$
windowrule = workspace 1, class:^(chromium)$
