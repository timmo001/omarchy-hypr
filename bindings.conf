# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- ghostty
$fileManager = uwsm app -- thunar
$browserPersonal = uwsm app -- chromium --new-window --ozone-platform=wayland --profile-directory="Default" --force-device-scale-factor=0.8
$browserWork = launch-work-browser
$discord = launch-work-discord
$slack = launch-work-slack
$systemBridge = timmo-run-command system-bridge backend
$virtmanager = /usr/bin/python3 /usr/bin/virt-manager

# Toggle top bar
bindd = SUPER SHIFT, W, Toggle top bar, exec, ~/.local/share/omarchy/bin/omarchy-restart-waybar
bindd = SUPER ALT, W, Workspace 1 relayout, exec, ~/.local/bin/laptop-workspace-1-relayout

# Screen recording region (bypasses portal, works on multi-GPU)
bindd = SHIFT ALT, PRINT, Screenrecording (region), exec, ~/.local/bin/omarchy-cmd-screenrecord --region

# Terminal
bindd = SUPER, return, Terminal, exec, $terminal --working-directory $(omarchy-cmd-terminal-cwd)
bindd = SUPER SHIFT, return, Floating Terminal, exec, uwsm app -- xdg-terminal-exec --app-id=org.omarchy.terminal
bindd = SUPER, Q, Terminal, exec, $terminal
bindd = SUPER SHIFT, Q, Floating Terminal, exec, uwsm app -- xdg-terminal-exec --app-id=org.omarchy.terminal

# Bluetooth
bindd = SUPER ALT CTRL, B, Bluetooth, exec, DEVICE="$(bluetoothctl devices | grep -i 'MOMENTUM 4' | awk '{print $2}')" && bluetoothctl disconnect "$DEVICE" && sleep 1 && bluetoothctl connect "$DEVICE"

# File manager
bindd = SUPER, E, File manager, exec, $fileManager

# Browser
bindd = SUPER, B, Browser, exec, $browserPersonal
bindd = SUPER SHIFT, B, Browser (private), exec, $browserPersonal --private

# Browser Work
bindd = SUPER ALT, B, Browser Work, exec, $browserWork

# Slack
bindd = SUPER SHIFT, S, Slack, exec, $slack

# Music
# bindd = SUPER, M, Music, exec, WINIT_UNIX_BACKEND=wayland GDK_BACKEND=wayland WEBKIT_DISABLE_DMABUF_RENDERER=1 ~/repos/music-assistant/desktop-companion/src-tauri/target/release/music-assistant-companion
bindd = SUPER, M, Music, exec, omarchy-launch-webapp "https://music.youtube.com"

# Obsidian
bindd = SUPER, N, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"

# Docker
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui timmo-run-command lazydocker

# 1Password
bindd = SUPER, slash, Passwords, exec, uwsm app -- timmo-run-command 1password

# YouTube
bindd = SUPER, Y, YouTube, exec, omarchy-launch-webapp "https://www.youtube.com/feed/subscriptions"

# Twitter
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://twitter.com/"
bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Twitch
bindd = SUPER ALT, T, Twitch, exec, omarchy-launch-webapp "https://twitch.tv/directory/following/live"

# T3 Chat
bindd = SUPER SHIFT, T, T3 Chat, exec, omarchy-launch-webapp "https://t3.chat"

# GitHub
bindd = SUPER ALT, G, GitHub, exec, omarchy-launch-webapp "https://github.com"

# Discord
bindd = SUPER, D, Discord, exec, $discord

# Home Assistant
bindd = SUPER, H, Home Assistant, exec, omarchy-launch-webapp "http://homeassistant.local:8123"
bindd = SUPER ALT, H, Home Assistant DEV, exec, omarchy-launch-webapp "http://localhost:8124"

# Home Assistant Dev
bindd = SUPER SHIFT, H, Home Assistant DEV, exec, omarchy-launch-tui timmo-run-command hadev

# Home Assistant Assist (Borderless Chrome window)
bindd = SUPER, A, Home Assistant Assist, exec, omarchy-launch-webapp "http://homeassistant.local:8123/?conversation=1"

# In a call
bind = SUPER SHIFT, C, exec, timmo-run-command go-automate ha ib t in_a_call

# Mic On
bind = SUPER SHIFT, M, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Twitch notifications menu
bind = CTRL ALT, T, exec, ~/.local/bin/twitch-menu
bind = CTRL ALT SHIFT, T, exec, ~/.config/dotfiles/scripts/.local/bin/twitch-notifications-recheck

# Dot diff tmux sessions
bind = CTRL ALT, R, exec, ~/.config/dotfiles/scripts/.local/bin/dot-diff-tmux-session changed
bind = CTRL ALT SHIFT, R, exec, ~/.config/dotfiles/scripts/.local/bin/dot-diff-tmux-session all

# Precise window resizing (fractional, like 1% volume with ALT)
bindd = SUPER ALT, code:20, Shrink window width (precise), resizeactive, -2 0   # ALT + -
bindd = SUPER ALT, code:21, Expand window width (precise), resizeactive, 2 0    # ALT + =
bindd = SUPER ALT SHIFT, code:20, Shrink window height (precise), resizeactive, 0 -2
bindd = SUPER ALT SHIFT, code:21, Expand window height (precise), resizeactive, 0 2

# Gamma-only dimming toggle
bindd = SUPER CTRL, D, Toggle dimming, exec, ~/.config/hypr/bin/hyprsunset-toggle-dim
bindd = SUPER CTRL, minus, Dim down, exec, ~/.config/hypr/bin/hyprsunset-dim-step down
bindd = SUPER CTRL, equal, Dim up, exec, ~/.config/hypr/bin/hyprsunset-dim-step up

# Dim control with Ctrl + Fn brightness keys
bindeld = CTRL, XF86MonBrightnessUp, Dim up, exec, ~/.config/hypr/bin/hyprsunset-dim-step up
bindeld = CTRL, XF86MonBrightnessDown, Dim down, exec, ~/.config/hypr/bin/hyprsunset-dim-step down

# Normal brightness disables dim
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
bindeld = , XF86MonBrightnessUp, Brightness up, exec, ~/.config/hypr/bin/hyprsunset-clear-dim && $osdclient --brightness raise
bindeld = , XF86MonBrightnessDown, Brightness down, exec, ~/.config/hypr/bin/hyprsunset-clear-dim && $osdclient --brightness lower
