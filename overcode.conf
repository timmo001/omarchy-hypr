# Overcode — Electron floating overlay (project: ~/repos/overcode)
# Reload after edits: hyprctl reload  (or log out of Hyprland session if envs change)
#
# Matches BrowserWindow title "Overcode" (src/main.ts). Check with: hyprctl clients -j | jq '.[] | select(.title|test("Overcode"))'
# If your build uses a different title or WM class, adjust the match lines.

# Keep as floating panel, no Hyprland border (app draws its own rounded chrome)
windowrule = float on, match:title ^Overcode$
# Top-right: margin from top/right edges (monitor-local; uses window size after map)
windowrule = move (monitor_w-window_w-24) 24, match:title ^Overcode$
windowrule = border_size 0, match:title ^Overcode$
windowrule = rounding 12, match:title ^Overcode$

# Full compositor opacity (test). For Omarchy default-opacity (focused 0.97, unfocused 0.9) use:
#   windowrule = tag +default-opacity, match:title ^Overcode$
#   windowrule = opacity 0.97 0.9, match:title ^Overcode$
windowrule = opacity 1 1, match:title ^Overcode$
